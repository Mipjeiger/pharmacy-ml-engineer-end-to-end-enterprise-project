version: "3.9"

services:
  # ==========================
  # Kubernetes (k3s)
  # ==========================
  k3s:
    image: rancher/k3s:v1.29.1-k3s1
    container_name: kubernetes
    privileged: true
    command: server --disable traefik
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=644
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./data/kubeconfig:/output
    ports:
      - "6443:6443"  # Kubernetes API server

  # ==========================
  # Redis (Feature online store)
  # ==========================
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  # ==========================
  # Prometheus (Monitoring)
  # ==========================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"

  # ==========================
  # Grafana (Visualization)
  # ==========================
  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"

  # ==========================
  # MinIO (Object Storage)
  # ==========================
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9011"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    ports:
      - "9010:9000"
      - "9011:9011"

  # ==========================
  # Feast feature store
  # ==========================
  feast:
    image: python:3.11-slim
    container_name: feast
    working_dir: /feature_repo
    volumes:
      - ./feature_repo:/feature_repo
      - ./requirements.txt:/requirements.txt
    command: >
      sh -c "
      pip install --no-cache-dir -r /requirements.txt &&
      feast server -h 0.0.0.0
      "
    ports:
      - "6566:6566"  # Feast Core
    depends_on:
      - redis
    env_file:
      - .env

  # ==========================
  # FastAPI Inference Service
  # ==========================
  api:
    image: python:3.11-slim
    container_name: pharmacy_api
    working_dir: /app
    volumes:
      - ./api:/app/api
      - ./models:/app/models
      - ./feature_repo:/app/feature_repo
      - ./requirements.txt:/requirements.txt
    command: >
      sh -c "
      pip install --no-cache-dir -r /requirements.txt &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - feast
    env_file:
      - .env
    restart: unless-stopped

  # ==========================
  # Training Container (Manual Run)
  # ==========================
  trainer:
    image: python:3.11-slim
    container_name: pharmacy-trainer
    working_dir: /trainer
    volumes:
      - ./training:/trainer/training
      - ./feature_repo:/trainer/feature_repo
      - ./models:/trainer/models
      - ./requirements.txt:/requirements.txt
    command: >
      sh -c "
      pip install --no-cache-dir -r /requirements.txt &&
      python3 training/train_ml_model.py
      "
    env_file:
      - .env
    profiles:
      - training

volumes:
  k3s-data: